<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Luxecart</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="container navbar">

            <a href="index.html" class="logo">
                Luxecart
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>

            <div class="nav-actions">
                <a href="cart.html" class="cart-btn">🛒</a>
            </div>

        </div>

    </header>


    <!-- Checkout -->
    <main>

        <section class="checkout-section">

            <div class="container">

                <div class="section-heading">
                    <p>COMPLETE YOUR ORDER</p>
                    <h1>Checkout</h1>
                </div>


                <div class="checkout-layout">

                    <!-- Customer Details -->
                    <form id="checkoutForm" class="checkout-form">

                        <h2>Delivery Information</h2>

                        <div class="form-row">

                            <div class="form-group">
                                <label for="firstName">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    id="firstName"
                                    name="firstName"
                                    placeholder="Enter your first name"
                                    required
                                >
                            </div>


                            <div class="form-group">
                                <label for="lastName">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    id="lastName"
                                    name="lastName"
                                    placeholder="Enter your last name"
                                    required
                                >
                            </div>

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="example@email.com"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Enter your phone number"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="address">
                                Address
                            </label>

                            <textarea
                                id="address"
                                name="address"
                                placeholder="House no., street, area"
                                required
                            ></textarea>

                        </div>


                        <div class="form-row">

                            <div class="form-group">

                                <label for="city">
                                    City
                                </label>

                                <input
                                    type="text"
                                    id="city"
                                    name="city"
                                    placeholder="City"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="pincode">
                                    PIN Code
                                </label>

                                <input
                                    type="text"
                                    id="pincode"
                                    name="pincode"
                                    placeholder="PIN Code"
                                    required
                                >

                            </div>

                        </div>


                        <h2 class="payment-heading">
                            Payment Method
                        </h2>


                        <div class="payment-options">

                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="cod"
                                    checked
                                >

                                <span>
                                    Cash on Delivery
                                </span>

                            </label>


                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="online"
                                >

                                <span>
                                    Online Payment
                                </span>

                            </label>

                        </div>


                        <button
                            type="submit"
                            class="btn primary-btn place-order-btn"
                        >
                            Place Order
                        </button>

                    </form>


                    <!-- Order Summary -->
                    <aside class="checkout-summary">

                        <h2>Order Summary</h2>

                        <div id="checkoutItems">
                        </div>


                        <div class="checkout-summary-line">

                            <span>Subtotal</span>

                            <span id="checkoutSubtotal">
                                ₹0
                            </span>

                        </div>


                        <div class="checkout-summary-line">

                            <span>Delivery</span>

                            <span id="checkoutDelivery">
                                ₹0
                            </span>

                        </div>


                        <div class="checkout-total">

                            <span>Total</span>

                            <span id="checkoutTotal">
                                ₹0
                            </span>

                        </div>

                    </aside>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container">

            <div class="footer-bottom">
                <p>
                    © 2026 Luxecart. All rights reserved.
                </p>
            </div>

        </div>

    </footer>


    <script src="js/checkout.js"></script>

</body>

</html>
